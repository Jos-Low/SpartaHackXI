<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map</title>

    <style>
      :root {
        --bar: #d7f0f2;
        --ink: #111;
        --bg: #fff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        background: var(--bg);
        color: var(--ink);
      }

      /* Top bar */
      .topbar {
        height: 52px;
        background: var(--bar);
        border-bottom: 2px solid var(--ink);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border: none;
        background: transparent;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
      }

      .icon-btn svg {
        width: 22px;
        height: 22px;
        stroke: var(--ink);
        stroke-width: 2.5;
        fill: none;
      }

      /* Map area */
      .wrap {
        padding: 12px;
      }

      .map {
        position: relative;
        width: 100%;
        max-width: 700px;
        height: 520px;
        border: 2px solid var(--ink);
        margin: 0 auto;
        background: #fff;
        overflow: hidden;
      }

      /* Dotted paths */
      .path {
        position: absolute;
        border-top: 3px dotted var(--ink);
        opacity: 0.85;
        transform-origin: left center;
      }

      /* Clickable nodes */
      .node {
        position: absolute;
        width: 90px;
        height: 90px;
        border: none;
        background: transparent;
        cursor: pointer;
        padding: 0;
      }

      .node svg {
        width: 100%;
        height: 100%;
        stroke: var(--ink);
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* optional little “frame” text like the sketch */
      .frame {
        position: absolute;
        font-size: 18px;
        color: rgba(0,0,0,0.18);
        user-select: none;
      }
    </style>
  </head>

  <body>
    <!-- Top bar -->
    <div class="topbar">
      <!-- X (close) -->
      <button class="icon-btn" id="closeBtn" aria-label="Close map">
        <svg viewBox="0 0 24 24">
          <path d="M6 6 L18 18" />
          <path d="M18 6 L6 18" />
        </svg>
      </button>

      <!-- Back arrow -->
      <button class="icon-btn" id="backBtn" aria-label="Go back">
        <svg viewBox="0 0 24 24">
          <path d="M15 6 L9 12 L15 18" />
          <path d="M10 12 H20" />
        </svg>
      </button>
    </div>

    <div class="wrap">
      <div class="map" id="map">
        <!-- faint “Frame” labels (like your sketch) -->
        <div class="frame" style="left: 140px; top: 220px;">Frame</div>
        <div class="frame" style="right: 80px; top: 120px;">Frame</div>
        <div class="frame" style="left: 330px; top: 360px;">Frame</div>

        <!-- Paths -->
        <!-- house -> tent -->
        <div class="path" style="left: 120px; top: 160px; width: 170px; transform: rotate(2deg);"></div>

        <!-- tent -> sword -->
        <div class="path" style="left: 360px; top: 230px; width: 220px; transform: rotate(-32deg);"></div>

        <!-- castle -> bear -->
        <div class="path" style="left: 190px; top: 390px; width: 280px; transform: rotate(6deg);"></div>

        <!-- castle -> tent (diagonal) -->
        <div class="path" style="left: 270px; top: 320px; width: 170px; transform: rotate(-63deg);"></div>

        <!-- Nodes -->
        <!-- House -->
        <button class="node" id="houseNode" style="left: 40px; top: 110px;" aria-label="House">
          <svg viewBox="0 0 120 120">
            <path d="M30 55 L60 30 L90 55" />
            <path d="M35 55 V90 H85 V55" />
            <path d="M55 90 V70 H65 V90" />
            <path d="M42 62 V75" />
            <path d="M78 62 V75" />
          </svg>
        </button>

        <!-- Tent -->
        <button class="node" id="tentNode" style="left: 280px; top: 120px;" aria-label="Tent">
          <svg viewBox="0 0 120 120">
            <path d="M30 90 L60 30 L90 90 Z" />
            <path d="M60 30 L70 50" />
            <path d="M65 55 H55" />
            <path d="M78 90 L98 60 L110 90 Z" />
          </svg>
        </button>

        <!-- Sword -->
        <button class="node" id="swordNode" style="left: 520px; top: 160px;" aria-label="Sword">
          <svg viewBox="0 0 120 120">
            <path d="M60 20 L70 35 L60 90 L50 35 Z" />
            <path d="M48 90 H72" />
            <path d="M60 90 V105" />
            <path d="M55 105 H65" />
            <!-- little “shine” marks -->
            <path d="M85 55 L95 50" />
            <path d="M85 65 L98 65" />
            <path d="M85 75 L95 80" />
          </svg>
        </button>

        <!-- Castle -->
        <button class="node" id="castleNode" style="left: 120px; top: 310px;" aria-label="Castle">
          <svg viewBox="0 0 120 120">
            <path d="M30 95 V55" />
            <path d="M30 55 L40 45 L50 55 L60 45 L70 55 L80 45 L90 55 V95 Z" />
            <path d="M45 95 V75 H75 V95" />
            <path d="M55 75 V60" />
            <path d="M65 75 V60" />
          </svg>
        </button>

        <!-- Bear face -->
        <button class="node" id="bearNode" style="left: 470px; top: 360px;" aria-label="Bear">
          <svg viewBox="0 0 120 120">
            <path d="M38 45 C30 35, 45 25, 52 38" />
            <path d="M82 45 C90 35, 75 25, 68 38" />
            <path d="M60 35 C30 35, 25 95, 60 95 C95 95, 90 35, 60 35 Z" />
            <path d="M48 65 C48 60, 55 60, 55 65" />
            <path d="M72 65 C72 60, 65 60, 65 65" />
            <path d="M56 80 C60 83, 64 83, 68 80" />
          </svg>
        </button>
      </div>
    </div>

    <script>
      // Close & Back buttons
      document.getElementById("closeBtn").addEventListener("click", () => {
        // closes the tab if it's opened as a tab
        window.close();
      });

      document.getElementById("backBtn").addEventListener("click", () => {
        history.back();
      });

      // Helper: open another extension page
      function openPage(file) {
        chrome.tabs.create({ url: chrome.runtime.getURL(file) });
      }

      // Click nodes -> open pages (change these filenames to your real pages)
      document.getElementById("houseNode").addEventListener("click", () => openPage("home.html"));
      document.getElementById("tentNode").addEventListener("click", () => openPage("tent.html"));
      document.getElementById("swordNode").addEventListener("click", () => openPage("sword.html"));
      document.getElementById("castleNode").addEventListener("click", () => openPage("castle.html"));
      document.getElementById("bearNode").addEventListener("click", () => openPage("bear.html"));
    </script>
  </body>
</html>
