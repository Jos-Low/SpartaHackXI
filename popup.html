<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; width: 280px; margin: 0; padding: 14px; }
      .title { font-weight: 800; margin-bottom: 10px; }
      .bar { height: 12px; background: #eee; border-radius: 999px; overflow: hidden; }
      .fill { height: 100%; width: 0%; background: #4caf50; }
      .row { display:flex; justify-content: space-between; margin-top: 10px; font-size: 13px; }
      button { margin-top: 12px; width: 100%; padding: 10px; cursor: pointer; }
      .settings-btn { 
        display: block; 
        margin-top: 10px; 
        text-align: center; 
        font-size: 13px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
      }
      .settings-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }
      .settings-btn:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="title">XP Buddy</div>

    <div id="levelText">Level 1</div>
    <div class="bar"><div class="fill" id="xpFill"></div></div>

    <div class="row">
      <div id="xpText">XP: 0/100</div>
      <div id="deltaHint"></div>
    </div>

    <a href="#" id="openOptions" class="settings-btn">⚙️ Edit Good/Bad Sites</a>

    <script src="popup.js"></script>
  </body>
</html>
