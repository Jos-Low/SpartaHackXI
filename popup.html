<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; width: 280px; margin: 0; padding: 14px; background: #f5f7fa; }
      .title { font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
      .character-icon { width: 40px; height: 40px; object-fit: contain; }
      .bar { height: 12px; background: #eee; border-radius: 999px; overflow: hidden; }
      .fill { height: 100%; width: 0%; background: #4caf50; }
      .row { display:flex; justify-content: space-between; margin-top: 10px; font-size: 13px; }
      .settings-btn {
        display: block;
        margin-top: 14px;
        text-align: center;
        font-size: 13px;
        background: linear-gradient(135deg, #ff0040 0%, #5b0815 100%);
        color: white;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(255, 0, 64, 0.3);
      }
      .settings-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(255, 0, 64, 0.4);
      }
      .settings-btn:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="title">
      <img src="assets/Animated_Flower.png" alt="XP Buddy" class="character-icon" id="characterIcon">
      <span>XP Buddy</span>
    </div>

    <div id="levelText">Level 1</div>
    <div class="bar"><div class="fill" id="xpFill"></div></div>

    <div class="row">
      <div id="xpText">XP: 0/100</div>
      <div id="deltaHint"></div>
    </div>
    <div>
    <button id="upgrade" disabled>Upgrade</button>
    <button id="reset">Reset</button>
    </div>

    <button id="openOptions" class="settings-btn">⚙️ Edit Good/Bad Sites</button>
    <div><button id="openMinigame" class="settings-btn">Test Memory Game</button></div>
    <div><button id="openMinigame3" class="settings-btn">Test Flow Free Game</button></div>

    <script src="popup.js"></script>
  </body>
</html>
