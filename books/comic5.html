<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comic Page [Page Number]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      background-color: white; /* Dark background */
      color: black;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

        img {
            max-width: 50%;
            height: auto;
            margin: 20px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: black; /* Primary color */
    }

    img {
      max-width: 50%;
      height: auto;
      margin: 40px 0;
      border: 5px solid #667eea;
      box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
    }

    .nav-buttons {
      margin-top: 30px;
      display: flex;
      gap: 20px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 5px;
      border: none;
      background: #d7f2f6;
      color: #eee;
      transition: background-color 0.3s, transform 0.1s;
      box-shadow: 0 4px 0px rgba(102, 126, 234, 0.5);
    }

    .arrow {
        color: #000;
    }

    button:hover {
      background: #667eea;
      color: #fff;
    }
    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0px rgba(102, 126, 234, 0.5);
    }

    #playBtn {
        font-family: 'Press Start 2P', monospace;
        color: black;
        background-color: #d7f2f6; /* Another accent color for play */
        border-color: none;
    }
    #playBtn:hover {
        background-color: #e66a8d;
    }
    #playBtn:active {
        box-shadow: 0 2px 0px rgba(215, 56, 94, 0.5);
    }
  </style>
</head>
<body>


    <!-- Comic label image -->
    <img src="../assets/comics/5.png" alt="Comic Book Label">

  <div class="nav-buttons">
    <button><a href="comic1.html">&lt;</a></button>
    <button id="playBtn">Play Game</button>
    <button><a href="comic2.html" disabled>></a></button>
  </div>

  <script src="./comicNav.js"></script>

</body>
</html>
