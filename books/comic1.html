<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Comic 1</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    img {
      max-width: 50%;
      height: auto;
      margin: 20px 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-top: 24px;
    }

    button {
      padding: 12px 18px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .arrow { font-size: 24px; width: 60px; }
    .play {
      font-weight: bold;
      background: #4caf50;
      color: white;
      padding: 14px 26px;
    }
    .play:disabled { background: #999; cursor: not-allowed; }
  </style>
</head>

<body>
  <img src="../assets/comics/1.png" alt="Comic 1" />

  <div class="nav">
    <button class="arrow" id="prevBtn" type="button">⬅</button>
    <button class="play" id="playBtn" type="button">▶ Play Minigame</button>
    <button class="arrow" id="nextBtn" type="button">➡</button>
  </div>

  <!-- ✅ External JS (required for MV3) -->
  
  <script src="./comicNav.js"></script>

</body>
</html>
