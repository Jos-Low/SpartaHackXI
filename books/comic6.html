<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comic Page 6</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      background-color: white;
      color: black;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    a{
        text-decoration: none;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: black;
    }

    img {
      max-width: 80%;
      height: auto;
      margin: 40px 0;
      border: 5px solid #667eea;
      box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
    }

    .nav-buttons {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    button {
      font-family: 'Press Start 2P', monospace;
      padding: 15px 22px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      border: none;
      background: #d7f2f6;
      color: black;
      transition: background-color 0.3s, transform 0.1s;
      box-shadow: 0 4px 0px rgba(102, 126, 234, 0.5);
    }

    button:hover {
      background: #667eea;
      color: #fff;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0px rgba(102, 126, 234, 0.5);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    #playBtn:hover {
      background-color: #e66a8d;
      color: white;
    }
  </style>
</head>

<body>

  <h1>Comic Page 6</h1>

  <!-- Comic image -->
  <img src="../assets/comics/6.png" alt="Comic Page 6">

  <div class="nav-buttons">
    <!-- Prev -->
    <button><a href="comic5.html">&lt;</a></button>

    <button id="playBtn">Play Game</button>

    <!-- Next (disabled because last page) -->
    <button disabled>&gt;</button>
  </div>

  <script>
    document.getElementById("playBtn").addEventListener("click", () => {
      alert("Play button clicked! Hook this to your game later.");
    });
  </script>

</body>
</html>
