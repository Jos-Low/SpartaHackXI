<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Game 3 — Flow Connect</title>
    <link rel="stylesheet" href="./game_3.css" />
  </head>

  <body>
    <div class="app">
      <header class="topbar">
        <div class="title">
          <span class="badge">Mini Game</span>
          <h1>Flow Connect</h1>
          <div id="levelLabel" class="levelLabel" aria-live="polite"></div>
        </div>

        <div class="controls">
          <div id="timer" class="timer">⏱ 0:00</div>
          <button id="resetBtn" class="btn" type="button">Reset</button>
          <button id="clearBtn" class="btn ghost" type="button">Clear All</button>
        </div>
      </header>

      <main class="main">
        <div class="boardWrap">
          <div id="board" class="board" aria-label="Game board"></div>
        </div>

        <div class="statusRow">
          <div id="status" class="status">Connect all matching colors.</div>
          <div id="progress" class="progress"></div>
          <button id="nextBtn" class="btn" type="button" style="display:none;">
            Next Level
          </button>
        </div>

        <div class="help">
          <p>
            <b>How to play:</b> Click/touch an endpoint circle and drag to the
            matching circle. Paths must be orthogonal (up/down/left/right) and
            cannot overlap.
          </p>
        </div>
      </main>
    </div>

    <!-- Win Screen -->
    <div id="winScreen" class="game-overlay hidden">
      <div class="result-box">
        <div class="trophy">🏆</div>
        <h1 class="win">✨ YOU WON! ✨</h1>
        <p>All levels completed!</p>
        <button class="game-btn primary" id="closeWinBtn">CLOSE</button>
      </div>
    </div>

    <!-- Time's Up Screen -->
    <div id="loseScreen" class="game-overlay hidden">
      <div class="result-box">
        <h1 class="lose">⏰ TIME'S UP!</h1>
        <p>Better luck next time!</p>
        <button class="game-btn primary" id="retryBtn">TRY AGAIN</button>
        <button class="game-btn" id="closeLoseBtn">CLOSE</button>
      </div>
    </div>

    <script src="./game_3.js"></script>
  </body>
</html>
