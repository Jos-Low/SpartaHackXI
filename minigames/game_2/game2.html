<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XP Buddy Jump!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: Arial, sans-serif;
    }
    
    #gameCanvas {
      border: 3px solid #4caf50;
      border-radius: 10px;
      background: #87CEEB;
    }
    
    #startScreen, #gameOverScreen, #winScreen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      z-index: 1000;
    }
    
    .hidden { display: none !important; }
    
    h1 { color: #4caf50; margin-bottom: 20px; }
    h1.gold { color: #ffd700; }
    p { color: white; margin-bottom: 20px; }
    
    button {
      padding: 15px 40px;
      font-size: 20px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 5px;
    }
    
    button:hover { background: #66bb6a; }
    
    button.gold {
      background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
      color: #000;
    }
    
    button.gold:hover {
      background: linear-gradient(135deg, #ffec80 0%, #ffd700 100%);
    }
    
    #score { 
      position: absolute; 
      top: 20px; 
      left: 50%;
      transform: translateX(-50%);
      color: white; 
      font-size: 24px;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 10px;
    }
    
    .trophy {
      font-size: 80px;
      margin-bottom: 20px;
    }
    
    .confetti {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: hidden;
    }
    
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: confetti-fall 3s linear infinite;
    }
    
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(600px) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="score" class="hidden">Score: <span id="scoreValue">0</span> / 5000</div>
  <canvas id="gameCanvas" width="800" height="800"></canvas>
  
  <div id="startScreen">
    <h1>🌻 XP Buddy Jump!</h1>
    <p>Use ← → or A D to move</p>
    <p>Reach 5000 points to win!</p>
    <button id="playBtn">PLAY</button>
  </div>
  
  <div id="gameOverScreen" class="hidden">
    <h1>Game Over!</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>
  
  <div id="winScreen" class="hidden">
    <div class="confetti" id="confettiContainer"></div>
    <div class="trophy">🏆</div>
    <h1 class="gold">YOU WIN!</h1>
    <p>Congratulations! You reached 2000 points!</p>
    <p>Final Score: <span id="winScore">2000</span></p>
    <button id="continueBtn" class="gold">CONTINUE</button>
  </div>

  <script src="game2.js"></script>
</body>
</html>
