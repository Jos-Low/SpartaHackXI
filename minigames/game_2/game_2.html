<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XP Buddy Jump!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Press Start 2P', monospace;
    }
    
    #gameCanvas {
      border: 3px solid #4caf50;
      border-radius: 10px;
      background: #87CEEB;
    }
    
    .hidden { display: none !important; }
    
    #score { 
      position: absolute; 
      top: 20px; 
      left: 50%;
      transform: translateX(-50%);
      color: white; 
      font-size: 24px;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 10px;
    }

    /* Game Over & Win Overlays - matching game 1 style */
    .game-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(235, 241, 229, 0.98);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .result-box {
      background: #ffffff;
      border: 4px solid #000;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.2);
    }

    .result-box h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .result-box h1.win { color: #22c55e; }
    .result-box h1.lose { color: #dc2626; }

    .result-box p {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 20px;
    }

    .final-score {
      font-size: 1.2rem;
      color: #000;
      font-weight: bold;
      margin-bottom: 30px;
      padding: 20px;
      background: #a8d5c8;
      border: 3px solid #000;
    }

    .game-btn {
      background: #6d968a;
      color: #fff;
      border: 3px solid #000;
      padding: 14px 28px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      cursor: pointer;
      margin: 0 10px;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
      transition: all 0.2s;
    }

    .game-btn:hover {
      background: #5a7d73;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 rgba(0,0,0,0.2);
    }

    .game-btn.primary { background: #4a90e2; }
    .game-btn.primary:hover { background: #357abd; }

    .trophy { font-size: 80px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="score" class="hidden">Score: <span id="scoreValue">0</span> / 2000</div>
  <canvas id="gameCanvas" width="800" height="800"></canvas>
  
  <!-- Game Over Overlay -->
  <div id="gameOverScreen" class="game-overlay hidden">
    <div class="result-box">
      <h1 class="lose">💀 GAME OVER</h1>
      <p>Better luck next time!</p>
      <div class="final-score">SCORE: <span id="finalScore">0</span></div>
      <button class="game-btn primary" id="restartBtn">PLAY AGAIN</button>
      <button class="game-btn" id="closeBtn">CLOSE</button>
    </div>
  </div>
  
  <!-- Win Screen -->
  <div id="winScreen" class="game-overlay hidden">
    <div class="result-box">
      <div class="trophy">🏆</div>
      <h1 class="win">✨ VICTORY! ✨</h1>
      <p>You completed the game!</p>
      <div class="final-score">SCORE: <span id="winScore">2000</span></div>
      <button class="game-btn primary" id="continueBtn">CLOSE</button>
    </div>
  </div>

  <script src="game_2.js"></script>
</body>
</html>
