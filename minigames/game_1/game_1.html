<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Jump Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./game_1.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1400" height="700"></canvas>
    
    <div id="ui">
      <div id="score">SCORE: <span id="scoreVal">0</span></div>
      <div id="best">BEST: <span id="bestVal">0</span></div>
      <div id="progress-container">
        <div id="progress-bar"></div>
        <div id="progress-text">0 / 250</div>
      </div>
    </div>

    <!-- End game overlay -->
    <div id="overlay" class="hidden">
      <div class="result-container">
        <h1 id="overlay-title">GAME OVER</h1>
        <p id="overlay-subtitle">Better luck next time!</p>
        <div id="final-score"></div>
        <div class="button-group">
          <button class="game-btn primary" id="restart-btn">PLAY AGAIN</button>
          <button class="game-btn" id="close-btn">CLOSE</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./game_1.js"></script>
</body>
</html>
