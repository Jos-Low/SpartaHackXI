<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Jump Game</title>
  <link rel="stylesheet" href="./game_1.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1400" height="700"></canvas>
    
    <div id="ui">
      <div id="score">SCORE: <span id="scoreVal">0</span></div>
      <div id="best">BEST: <span id="bestVal">0</span></div>
      <div id="progress-container">
        <div id="progress-bar"></div>
        <div id="progress-text">0 / 250</div>
      </div>
    </div>

    <div id="overlay">
      <h1 id="overlay-title">🌸 FLOWER JUMP</h1>
      <p id="overlay-subtitle">Avoid obstacles and butterflies!</p>
      <p id="final-score"></p>
      <button id="start-btn">START GAME</button>
    </div>
  </div>

  <script src="./game_1.js"></script>
</body>
</html>
